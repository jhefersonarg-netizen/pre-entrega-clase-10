<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Entrega 10: APIs, Peticiones y Librerías</title>
    
    
   <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="js/main.js"defer></script>
    
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    
    <div id="banner-asincrono" class="banner hidden"></div>

    <h1>🛒 Simulador Profesional: Carga de Datos y Librerías</h1>
    <p>Proyecto con servidores alternativos de alta disponibilidad.</p>

    <div class="grid-tienda">
       
        <div class="panel">
            <h2>Productos Disponibles</h2>
            <div id="catalogo-productos">
                <p id="texto-cargando" style="color: #7f8c8d; font-weight: bold;">Cargando productos...</p>
            </div>
        </div>

   
        <div class="panel">
            <h2>Tu Carrito de Compras</h2>
            <div id="contenedor-carrito"></div>
            
            <div class="totales">
                <p>Total artículos: <span id="total-items">0</span></p>
                <p>Total a pagar: <strong>$<span id="total-dinero">0</span></strong></p>
            </div>
            <button id="btn-comprar" style="width: 100%; margin-top: 10px; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1em;">🛍️ Finalizar Compra</button>


            <button id="btn-vaciar-carrito" class="btn-eliminar" style="width: 100%; margin-top: 10px; padding: 12px;">🗑️ Vaciar Todo el Carrito</button>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    
  
    
</body>
</html>
